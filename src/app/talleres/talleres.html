<h2 class="mb-4">Talleres disponibles</h2>

<div class="row">
  @for (taller of talleres; track taller.id) {
    <div class="col-md-4 mb-4">
      <div class="card h-100">
        <div class="card-body">
          <h5 class="card-title">{{ taller.nombre }}</h5>
          <p class="card-text"><strong>Categoría:</strong> {{ taller.categoria }}</p>
          <p class="card-text"><strong>Duración:</strong> {{ taller.duracion }}</p>
          <p class="card-text"><strong>Modalidad:</strong> {{ taller.modalidad }}</p>
          <p class="card-text"><strong>Costo:</strong> $ {{ taller.costo }}</p>
          <p class="card-text"><strong>Cupos:</strong> {{ taller.cupos }}</p>
        </div>
        <div class="card-footer">
          <a class="btn btn-secondary" [routerLink]="['/taller', taller.id]">Ver detalle</a>
          <a class="btn btn-danger ms-2" [routerLink]="['/reserva', taller.id]">Reservar</a>
        </div>
      </div>
    </div>
  }
</div>
